name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KS_B64 }}
      KS_PASS: ${{ secrets.KS_PASS }}
      KS_ALIAS: ${{ secrets.KS_ALIAS }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web folder
        run: |
          mkdir -p www assets
          cp index.html style.css app.js data.js www/
          cp icon-only.png assets/ || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit installed dependencies
        run: npm audit --audit-level=high

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android project
        run: python3 patch_android.py

      - name: Generate icons (optional)
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0f3d2e' --iconBackgroundColorDark '#0f3d2e'

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duas-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
